name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.lock.txt pyflakes pip-audit
      - name: Static checks (undefined names, unused imports, syntax)
        run: python -m pyflakes *.py tests
      - name: Tests (no API key or network needed)
        run: python -m pytest -q
      - name: Dependency vulnerability scan
        run: pip-audit -r requirements.lock.txt
        continue-on-error: true   # review advisories; do not block merges on transitive issues
      - name: Health check on a fresh database
        run: DB_PATH=/tmp/ci.db python -c "from database import init_db; init_db()" && DB_PATH=/tmp/ci.db python healthcheck.py || true
